# Redis Configuration for AWS Free Tier Simulation
# Optimized for 1GB total system memory

# Basic Configuration
bind 0.0.0.0
port 6379
timeout 10

# Memory Management (200MB max for free tier - 20% of total 1GB)
maxmemory 200mb
maxmemory-policy allkeys-lru

# Connection Management (optimized for free tier)
tcp-keepalive 120
maxclients 50

# Persistence Configuration (RDB snapshots)
save 900 1
save 300 10
save 60 10000

# RDB configuration
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Logging for debugging
loglevel notice
logfile ""

# Disable dangerous commands for security (even in development)
rename-command FLUSHDB ""
rename-command FLUSHALL ""

# Network settings
protected-mode no

# Append Only File (AOF) disabled for simplicity in development
appendonly no

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Slow log configuration for debugging
slowlog-log-slower-than 10000
slowlog-max-len 128

# No authentication for local development simplicity
# requirepass disabled

# Background operations
always-show-logo yes