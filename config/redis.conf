# Redis Configuration for Local Development
# Based on FASE-2 specifications

# Basic Configuration
bind 0.0.0.0
port 6379
timeout 5

# Memory Management (512MB max for local development)
maxmemory 512mb
maxmemory-policy allkeys-lru

# Connection Management
tcp-keepalive 300
maxclients 10

# Persistence Configuration (RDB snapshots)
save 900 1
save 300 10
save 60 10000

# RDB configuration
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Logging for debugging
loglevel notice
logfile ""

# Disable dangerous commands for security (even in development)
rename-command FLUSHDB ""
rename-command FLUSHALL ""

# Network settings
protected-mode no

# Append Only File (AOF) disabled for simplicity in development
appendonly no

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Slow log configuration for debugging
slowlog-log-slower-than 10000
slowlog-max-len 128

# No authentication for local development simplicity
# requirepass disabled

# Background operations
always-show-logo yes